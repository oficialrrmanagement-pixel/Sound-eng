<!doctype html><html lang="pt-PT"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#00843D"><title>Team Duck</title><link rel="icon" href="icon.svg"><link rel="apple-touch-icon" href="icon.svg"><link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="styles.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="https://cdn.jsdelivr.net/npm/tus-js-client@4.3.1/dist/tus.min.js"></script></head><body><div id="toast"></div><main id="login" class="screen login"><section class="login-card"><img class="logo" src="icon.svg"><h1>Team Duck</h1><p class="subtitle">Sound Engineer Management</p><form id="loginForm"><label>E-mail<input id="email" type="email" required></label><label>Password<input id="password" type="password" required></label><button>Entrar</button><p id="loginError" class="error"></p></form></section></main><main id="app" class="screen hidden"><header><div class="brand"><img src="icon.svg"><span><strong>Team Duck</strong><small id="whoami">Sound Engineer Management</small></span></div><button id="logout" class="ghost">Sair</button></header><nav id="nav"><button data-page="dashboard" class="active">Resumo</button><button data-page="agenda">Agenda</button><button data-page="artists">Artistas</button><button data-page="team">Equipa</button><button data-page="calendar">Google</button></nav><section id="dashboard" class="page"><h2>Resumo</h2><div class="stats"><article><small>Próximos trabalhos</small><b id="statConcerts">—</b></article><article><small>Artistas</small><b id="statArtists">—</b></article><article><small>Por receber</small><b id="statDue">—</b></article></div><h3>Próximos trabalhos</h3><div id="nextConcerts" class="list"></div></section><section id="agenda" class="page hidden"><div class="title-row"><h2>Agenda</h2><button id="newConcert">+ Trabalho</button></div><div id="concerts" class="list"></div></section><section id="artists" class="page hidden"><div class="title-row"><h2>Artistas</h2><button id="newArtist">+ Artista</button></div><div id="artistList" class="list"></div></section><section id="team" class="page hidden"><div class="title-row"><h2>Equipa</h2><button id="newMemberBtn">+ Convidar</button></div><div id="teamList" class="list"></div></section><section id="calendar" class="page hidden"><h2>Google Calendar</h2><article class="panel"><h3>Agenda Google / Gmail</h3><p>A ligação ao Google Calendar fica para uma fase posterior.</p><button disabled>Ligar conta Google</button></article></section></main><dialog id="artistDialog"><form id="artistForm"><h3>Novo artista</h3><label>Nome<input id="artistName" required></label><label>Cachet base (€)<input id="artistFee" type="number" step=".01"></label><label>Telefone<input id="artistPhone"></label><label>E-mail<input id="artistEmail" type="email"></label><div class="actions"><button type="button" data-close>Cancelar</button><button>Guardar</button></div></form></dialog><dialog id="concertDialog"><form id="concertForm"><h3>Novo trabalho</h3><label>Artista<select id="concertArtist" required></select></label><label>Início<input id="concertStart" type="datetime-local" required></label><label>Fim<input id="concertEnd" type="datetime-local"></label><label>Local<input id="concertVenue"></label><label>Cidade<input id="concertCity"></label><label>Função<select id="concertPosition"><option>FOH</option><option>ROH</option></select></label><label>Cachet (€)<input id="concertFee" type="number" step=".01"></label><label>Recebido (€)<input id="concertReceived" type="number" step=".01" value="0"></label><label>Notas<textarea id="concertNotes"></textarea></label><div class="actions"><button type="button" data-close>Cancelar</button><button>Guardar</button></div></form></dialog><script src="app.js"></script><script src="https://fnuchugrbwvmmtfbpboa.supabase.co/functions/v1/team-duck-v5-enhance"></script></body></html>
