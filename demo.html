<!doctype html><html lang="pt-PT"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"><meta name="theme-color" content="#00843D"><title>Team Duck · Demo</title><link rel="icon" href="/401FB0DA-DAD2-49CE-89E0-A9850A0722F7.png"><style>:root{color-scheme:dark;--g:#86e54a;--bg:#07130b;--panel:rgba(10,31,19,.9);--line:rgba(255,255,255,.12);--muted:#aeb7b1}*{box-sizing:border-box}body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:radial-gradient(circle at 20% 0,#133522 0,#07130b 34%,#041008 100%);color:#fff;min-height:100vh}header{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:12px;padding:14px 16px;background:rgba(3,15,8,.92);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}header img{width:44px;height:44px;object-fit:contain;border-radius:12px}header strong{font-size:20px}header small{display:block;color:var(--muted)}.badge{margin-left:auto;background:#d8ff3e;color:#07130b;padding:7px 10px;border-radius:999px;font-weight:900;font-size:11px}.banner{padding:8px 12px;text-align:center;background:#d8ff3e;color:#07130b;font-weight:900;font-size:12px}.nav{display:flex;gap:8px;overflow:auto;padding:12px 14px;position:sticky;top:73px;z-index:4;background:rgba(4,16,9,.9);backdrop-filter:blur(10px)}.nav button{border:1px solid var(--line);background:#0b2315;color:#fff;border-radius:12px;padding:9px 12px;font-weight:800;white-space:nowrap}.nav button.active{border-color:var(--g);color:var(--g)}main{max-width:980px;margin:0 auto;padding:18px 14px 50px}.page{display:none}.page.active{display:block}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stat,.panel,.item{background:var(--panel);border:1px solid var(--line);border-radius:16px}.stat{padding:16px}.stat small{color:var(--muted)}.stat b{display:block;font-size:28px;margin-top:4px}.panel{padding:14px;margin-top:14px}.list{display:grid;gap:10px}.item{padding:14px;display:flex;justify-content:space-between;gap:12px;align-items:center}.item strong{display:block;font-size:17px}.item small{display:block;color:var(--muted);margin-top:3px}.money{font-weight:900;color:#dfffc8}.paid{color:#9dff9d;font-weight:900}.chip{padding:6px 9px;border-radius:999px;border:1px solid var(--g);color:var(--g);font-size:12px;font-weight:900}.muted{color:var(--muted)}h2{margin:4px 0 14px}h3{margin:20px 0 10px}@media(max-width:620px){.stats{grid-template-columns:1fr}.item{align-items:flex-start}.badge{display:none}.nav{top:73px}}</style></head><body><div class="banner">MODO DEMONSTRAÇÃO · DADOS 100% FICTÍCIOS · NENHUMA ALTERAÇÃO É GRAVADA</div><header><img src="/401FB0DA-DAD2-49CE-89E0-A9850A0722F7.png" alt="Team Duck"><div><strong>Team Duck</strong><small>Sound Engineer Management · Demo</small></div><span class="badge">DEMO PÚBLICA</span></header><nav class="nav"><button data-tab="resumo" class="active">Resumo</button><button data-tab="agenda">Agenda</button><button data-tab="fechados">Fechados</button><button data-tab="artistas">Artistas</button><button data-tab="equipa">Equipa</button></nav><main><section id="resumo" class="page active"><h2>Resumo</h2><div class="stats"><div class="stat"><small>Próximos trabalhos</small><b>9</b></div><div class="stat"><small>Artistas</small><b>6</b></div><div class="stat"><small>Por receber</small><b>4 320,00 €</b></div></div><h3>Próximos trabalhos</h3><div id="resumoList" class="list"></div></section><section id="agenda" class="page"><h2>Agenda</h2><div id="agendaList" class="list"></div></section><section id="fechados" class="page"><h2>Fechados</h2><p class="muted">Trabalhos pagos e finalizados.</p><div id="closedList" class="list"></div></section><section id="artistas" class="page"><h2>Artistas</h2><div id="artistList" class="list"></div></section><section id="equipa" class="page"><h2>Equipa</h2><div id="teamList" class="list"></div></section></main><script>const artists=[['Neon Harbor',850],['Atlas Avenue',1200],['Lunar Echo',1500],['Velvet Transit',950],['Northline',1800],['Golden Pulse',1100]];const team=[['Miguel Santos','Parceiro','Lisboa'],['Ana Martins','Parceiro','Porto'],['Tiago Lopes','Parceiro','Braga'],['Marta Ferreira','Substituto','Coimbra'],['Bruno Costa','Substituto','Aveiro'],['Inês Almeida','Substituto','Faro']];const rows=[['Neon Harbor','Coimbra','Convento São Francisco','FOH',950,2,false],['Northline','Aveiro','Centro Congressos','ROH',1800,5,false],['Golden Pulse','Aveiro','Teatro Aveirense','FOH',1100,5,false],['Neon Harbor','Faro','Teatro das Figuras','FOH+ROH',1000,9,false],['Atlas Avenue','Lisboa','Campo Pequeno','FOH',1300,14,false],['Lunar Echo','Lisboa','Coliseu','ROH',1550,14,false],['Velvet Transit','Porto','Casa da Música','FOH',900,21,false],['Northline','Braga','Theatro Circo','FOH+ROH',1750,30,false],['Golden Pulse','Coimbra','TAGV','ROH',1150,45,false],['Neon Harbor','Lisboa','Altice Arena','FOH',850,-20,true],['Atlas Avenue','Porto','Super Bock Arena','ROH',1200,-12,true],['Lunar Echo','Braga','Forum Braga','FOH+ROH',1500,-3,true]];const fmt=d=>new Intl.DateTimeFormat('pt-PT',{dateStyle:'medium',timeStyle:'short'}).format(d);const eur=v=>new Intl.NumberFormat('pt-PT',{style:'currency',currency:'EUR'}).format(v);function dateFor(days){const d=new Date();d.setDate(d.getDate()+days);d.setHours(21,30,0,0);return d}function card(r,closed=false){return `<article class="item"><div><strong>${r[0]}</strong><small>${fmt(dateFor(r[5]))} · ${r[1]} · ${r[3]}</small><small>${r[2]}</small>${closed?'<small class="paid">✓ Pago · Fechado</small>':''}</div><div><span class="money">${eur(r[4])}</span>${!closed?`<div class="chip" style="margin-top:7px">${r[3]}</div>`:''}</div></article>`}document.getElementById('resumoList').innerHTML=rows.filter(r=>!r[6]).slice(0,5).map(r=>card(r)).join('');document.getElementById('agendaList').innerHTML=rows.filter(r=>!r[6]).map(r=>card(r)).join('');document.getElementById('closedList').innerHTML=rows.filter(r=>r[6]).map(r=>card(r,true)).join('');document.getElementById('artistList').innerHTML=artists.map(a=>`<article class="item"><div><strong>${a[0]}</strong><small>booking@demo.invalid</small></div><span class="money">${eur(a[1])}</span></article>`).join('');document.getElementById('teamList').innerHTML=team.map(t=>`<article class="item"><div><strong>${t[0]}</strong><small>${t[1]} · ${t[2]}</small></div><span class="chip">${t[1]}</span></article>`).join('');document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.nav button').forEach(x=>x.classList.toggle('active',x===b));document.querySelectorAll('.page').forEach(p=>p.classList.toggle('active',p.id===b.dataset.tab))});</script></body></html>
