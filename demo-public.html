<!doctype html><html lang="pt-PT"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b170f"><title>Team Duck · Demo</title><link rel="icon" href="/401FB0DA-DAD2-49CE-89E0-A9850A0722F7.png"><style>*{box-sizing:border-box}body{margin:0;background:linear-gradient(rgba(4,12,7,.82),rgba(4,12,7,.9)),url('/team-duck-cinematic-bg.jpg') center/cover fixed;color:#eef7ef;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;min-height:100vh}button{font:inherit}.shell{max-width:980px;margin:auto;min-height:100vh}.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:10px 12px;background:rgba(5,14,9,.94);backdrop-filter:blur(14px);border-bottom:1px solid rgba(255,255,255,.08)}.brand{display:flex;align-items:center;gap:9px;min-width:0}.brand img{width:38px;height:38px;border-radius:10px;object-fit:cover}.brand b{font-size:15px}.brand small{display:block;color:#9fac9f;font-size:10px}.spacer{flex:1}.badge{font-size:10px;font-weight:900;letter-spacing:.04em;padding:6px 8px;border-radius:999px;background:#d8ff3e;color:#0a150c;white-space:nowrap}.lang{position:relative}.lang>button{width:34px;height:34px;border-radius:50%;border:1px solid rgba(255,255,255,.14);background:rgba(4,13,8,.75);color:#d8ff3e;font-size:10px;font-weight:950}.lang-menu{position:absolute;right:0;top:40px;padding:5px;background:#07100b;border:1px solid rgba(255,255,255,.12);border-radius:12px;box-shadow:0 12px 30px #0008}.lang-menu[hidden]{display:none}.lang-menu button{display:block;width:48px;border:0;background:transparent;color:#c8d0ca;padding:8px;border-radius:8px;font-size:11px;font-weight:900}.nav{display:flex;gap:6px;overflow:auto;padding:10px 12px;border-bottom:1px solid rgba(255,255,255,.06);background:rgba(5,14,9,.72);scrollbar-width:none}.nav button{border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.04);color:#cbd6ce;border-radius:11px;padding:9px 12px;font-size:12px;font-weight:800;white-space:nowrap}.nav button.active{background:#d8ff3e;color:#0a150c;border-color:#d8ff3e}.page{padding:14px 12px 34px}.demo-note{font-size:11px;color:#b9c5bc;padding:9px 11px;border:1px solid rgba(216,255,62,.16);background:rgba(216,255,62,.05);border-radius:12px;margin-bottom:12px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.card,.item{background:rgba(7,18,11,.72);border:1px solid rgba(255,255,255,.08);border-radius:16px;padding:13px;box-shadow:0 10px 30px rgba(0,0,0,.14)}.card small,.item small{color:#93a098}.card b{display:block;font-size:22px;margin-top:4px}.section-title{margin:18px 2px 9px;font-size:15px}.list{display:grid;gap:8px}.item{display:flex;align-items:center;gap:11px}.dot{width:10px;height:10px;border-radius:50%;flex:0 0 10px}.main{min-width:0;flex:1}.main strong{font-size:13px}.main small{display:block;margin-top:3px;font-size:11px}.money{font-size:12px;font-weight:900;color:#d8ff3e}.past{filter:grayscale(1);opacity:.62}.avatar{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:#163322;border:1px solid rgba(255,255,255,.1);font-weight:950;color:#d8ff3e}.status{font-size:10px;font-weight:900;padding:5px 7px;border-radius:999px}.green{background:#163c20;color:#7bed8b}.yellow{background:#3f3513;color:#ffd961}.red{background:#431c1c;color:#ff8d8d}.paid{background:#163c20;color:#8cf19c}.muted{color:#9ba79e}.footer{padding:18px 12px 30px;text-align:center;color:#7f8d83;font-size:10px}@media(max-width:600px){.brand small{display:none}.badge{font-size:9px;padding:5px 7px}.stats{gap:6px}.card{padding:11px}.card b{font-size:18px}.item{padding:11px}.money{font-size:11px}.top{gap:7px}.brand img{width:34px;height:34px}.brand b{font-size:13px}}</style></head><body><div class="shell"><header class="top"><div class="brand"><img src="/401FB0DA-DAD2-49CE-89E0-A9850A0722F7.png"><div><b>Team Duck</b><small>Sound Engineer Management</small></div></div><div class="spacer"></div><span class="badge" id="demoBadge">MODO DEMO</span><div class="lang"><button id="langBtn">PT</button><div id="langMenu" class="lang-menu" hidden><button data-lang="pt">PT</button><button data-lang="en">EN</button><button data-lang="fr">FR</button></div></div></header><nav class="nav" id="nav"></nav><main id="content"></main><div class="footer" id="footer">Demonstração pública · dados 100% fictícios · sem acesso à base real</div></div><script>(()=>{const L={pt:{tabs:['Resumo','Agenda','Finalizados','Artistas','Equipa','Disponibilidade'],demo:'MODO DEMO',note:'Esta é uma demonstração pública. Todos os nomes, locais, valores e datas são fictícios.',up:'Próximos trabalhos',artists:'Artistas',due:'Por receber',next:'Próximos trabalhos',closed:'Trabalhos finalizados e pagos',team:'Equipa fictícia',avail:'Disponibilidade da equipa',free:'Livre',hold:'Reserva',busy:'Ocupado',paid:'PAGO',footer:'Demonstração pública · dados 100% fictícios · sem acesso à base real'},en:{tabs:['Overview','Schedule','Completed','Artists','Team','Availability'],demo:'DEMO MODE',note:'This is a public demo. All names, venues, amounts and dates are fictional.',up:'Upcoming jobs',artists:'Artists',due:'Outstanding',next:'Upcoming jobs',closed:'Completed and paid jobs',team:'Fictional team',avail:'Team availability',free:'Available',hold:'Hold',busy:'Busy',paid:'PAID',footer:'Public demo · 100% fictional data · no access to the real database'},fr:{tabs:['Résumé','Agenda','Finalisés','Artistes','Équipe','Disponibilité'],demo:'MODE DÉMO',note:'Ceci est une démonstration publique. Tous les noms, lieux, montants et dates sont fictifs.',up:'Prochains travaux',artists:'Artistes',due:'À recevoir',next:'Prochains travaux',closed:'Travaux finalisés et payés',team:'Équipe fictive',avail:"Disponibilité de l’équipe",free:'Libre',hold:'Réserve',busy:'Occupé',paid:'PAYÉ',footer:'Démo publique · données 100 % fictives · aucun accès à la base réelle'}};let lang=localStorage.getItem('team-duck-public-demo-lang')||'pt',tab=0;const tech=['Miguel Santos','Ana Martins','Tiago Lopes','Marta Ferreira','Bruno Costa','Inês Almeida'],artists=['Neon Harbor','Atlas Avenue','Lunar Echo','Velvet Transit','Northline','Golden Pulse'];const jobs=[['Neon Harbor','Lisboa','Altice Arena','FOH',850,-12],['Atlas Avenue','Porto','Super Bock Arena','ROH',1200,-4],['Lunar Echo','Braga','Forum Braga','FOH + ROH',1500,2],['Velvet Transit','Coimbra','Convento São Francisco','FOH',950,6],['Northline','Aveiro','Centro Congressos','ROH',1800,6],['Golden Pulse','Faro','Teatro das Figuras','FOH + ROH',1100,14]];const colors=['#53d769','#f2b72f','#38a9e8','#9b6cff','#ff6b57','#2fd0b2'];function date(d){const x=new Date();x.setDate(x.getDate()+d);return new Intl.DateTimeFormat(lang==='pt'?'pt-PT':lang==='fr'?'fr-FR':'en-GB',{day:'2-digit',month:'short',year:'numeric'}).format(x)}function money(v){return new Intl.NumberFormat(lang==='pt'?'pt-PT':lang==='fr'?'fr-FR':'en-GB',{style:'currency',currency:'EUR',maximumFractionDigits:0}).format(v)}function job(j,i,paid=false){return `<div class="item ${j[5]<0?'past':''}"><span class="dot" style="background:${j[5]<0?'#777':colors[i%colors.length]}"></span><div class="main"><strong>${j[0]}</strong><small>${date(j[5])} · ${j[1]} · ${j[2]} · ${j[3]}</small></div><span class="money">${paid?L[lang].paid+' · ':''}${money(j[4])}</span></div>`}function renderNav(){nav.innerHTML=L[lang].tabs.map((x,i)=>`<button class="${i===tab?'active':''}" data-i="${i}">${x}</button>`).join('');nav.querySelectorAll('button').forEach(b=>b.onclick=()=>{tab=+b.dataset.i;render()})}function render(){document.documentElement.lang=lang==='pt'?'pt-PT':lang;langBtn.textContent=lang.toUpperCase();demoBadge.textContent=L[lang].demo;footer.textContent=L[lang].footer;renderNav();let h=`<section class="page"><div class="demo-note">${L[lang].note}</div>`;if(tab===0)h+=`<div class="stats"><div class="card"><small>${L[lang].up}</small><b>4</b></div><div class="card"><small>${L[lang].artists}</small><b>6</b></div><div class="card"><small>${L[lang].due}</small><b>${money(3650)}</b></div></div><h3 class="section-title">${L[lang].next}</h3><div class="list">${jobs.filter(x=>x[5]>=0).slice(0,4).map(job).join('')}</div>`;if(tab===1)h+=`<h3 class="section-title">${L[lang].tabs[1]}</h3><div class="list">${jobs.map(job).join('')}</div>`;if(tab===2)h+=`<h3 class="section-title">${L[lang].closed}</h3><div class="list">${jobs.slice(0,3).map((j,i)=>job(j,i,true)).join('')}</div>`;if(tab===3)h+=`<h3 class="section-title">${L[lang].tabs[3]}</h3><div class="list">${artists.map((a,i)=>`<div class="item"><span class="dot" style="background:${colors[i]}"></span><div class="main"><strong>${a}</strong><small>${['Lisboa','Porto','Braga','Coimbra','Aveiro','Faro'][i]} · ${money([850,1200,1500,950,1800,1100][i])}</small></div></div>`).join('')}</div>`;if(tab===4)h+=`<h3 class="section-title">${L[lang].team}</h3><div class="list">${tech.map((x,i)=>`<div class="item"><div class="avatar">${x.split(' ').map(y=>y[0]).slice(0,2).join('')}</div><div class="main"><strong>${x}</strong><small>${i<3?'Partner':'Substitute'} · ${['Lisboa','Porto','Braga','Coimbra','Aveiro','Faro'][i]}</small></div></div>`).join('')}</div>`;if(tab===5){const s=[['green',L[lang].free],['yellow',L[lang].hold],['red',L[lang].busy],['green',L[lang].free],['red',L[lang].busy],['yellow',L[lang].hold]];h+=`<h3 class="section-title">${L[lang].avail}</h3><div class="list">${tech.map((x,i)=>`<div class="item"><div class="avatar">${x.split(' ').map(y=>y[0]).slice(0,2).join('')}</div><div class="main"><strong>${x}</strong><small>${date(7)}</small></div><span class="status ${s[i][0]}">${s[i][1]}</span></div>`).join('')}</div>`}content.innerHTML=h+'</section>'}langBtn.onclick=e=>{e.stopPropagation();langMenu.hidden=!langMenu.hidden};langMenu.querySelectorAll('button').forEach(b=>b.onclick=e=>{e.stopPropagation();lang=b.dataset.lang;localStorage.setItem('team-duck-public-demo-lang',lang);langMenu.hidden=true;render()});document.addEventListener('click',()=>langMenu.hidden=true);render()})();</script></body></html>
