<!doctype html><html lang="pt-PT"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#061008"><title>Team Duck · Confirmar disponibilidade</title><style>*{box-sizing:border-box}html,body{margin:0;background:#050807;color:#f6f7f6;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{min-height:100vh;display:grid;place-items:center;padding:22px}.wrap{width:min(100%,560px)}.brand{display:flex;align-items:center;gap:12px;margin-bottom:16px}.brand img{width:58px;height:58px;border-radius:16px}.brand strong{font-size:25px;color:#8adf62}.card{background:linear-gradient(180deg,#0b1210,#090d0c);border:1px solid #2e5e39;border-radius:24px;padding:22px;box-shadow:0 20px 60px #0009}h1{font-size:24px;margin:0 0 18px}.row{padding:12px 0;border-bottom:1px solid #1f2b25}.row:last-of-type{border-bottom:0}.k{display:block;color:#81d85d;font-size:12px;font-weight:800;text-transform:uppercase;margin-bottom:4px}.v{font-size:17px}.status{margin-top:16px;padding:12px 14px;border-radius:14px;background:#121d18;color:#dbe7df}.actions{display:grid;grid-template-columns:1fr;gap:12px;margin-top:20px}button{border:0;border-radius:15px;padding:15px;font:inherit;font-size:17px;font-weight:800;color:white}.yes{background:#2d9f54}.no{background:#8e3333}.msg{padding:12px 14px;margin-bottom:16px;border-radius:14px;background:#102219;color:#dff5e7}.error{color:#ff9a9a}.foot{text-align:center;color:#819087;font-size:12px;margin-top:16px}</style></head><body><main class="wrap"><div class="brand"><img src="401FB0DA-DAD2-49CE-89E0-A9850A0722F7.png" alt="Team Duck"><strong>Team Duck</strong></div><section class="card"><div id="content"><h1>A carregar convite…</h1></div></section><div class="foot">Resposta segura associada apenas a esta data.</div></main><script>const SUPA='https://fnuchugrbwvmmtfbpboa.supabase.co/functions/v1';const qs=new URLSearchParams(location.search);const token=qs.get('token')||'';const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));function statusLabel(s){return s==='accepted'?'✅ Disponível':s==='declined'?'❌ Indisponível':'⏳ A aguardar resposta'}async function load(){const host=document.getElementById('content');if(!token){host.innerHTML='<h1>Link inválido</h1><p class="error">Este convite não é válido.</p>';return}try{const r=await fetch(`${SUPA}/concert-invite?token=${encodeURIComponent(token)}`,{cache:'no-store'});const j=await r.json();if(!r.ok||!j.ok)throw new Error('expired');const c=j.concert;const dt=new Intl.DateTimeFormat('pt-PT',{dateStyle:'full',timeStyle:'short',timeZone:'Europe/Lisbon'}).format(new Date(c.starts_at));const loc=[c.venue,c.city].filter(Boolean).join(' · ')||'Por definir';host.innerHTML=`<h1>Confirmar disponibilidade</h1><div class="row"><span class="k">Técnico</span><span class="v">${esc(c.technician_name)}</span></div><div class="row"><span class="k">Artista</span><span class="v">${esc(c.artist_name)}</span></div><div class="row"><span class="k">Data e hora</span><span class="v">${esc(dt)}</span></div><div class="row"><span class="k">Local</span><span class="v">${esc(loc)}</span></div><div class="row"><span class="k">Função</span><span class="v">${esc(c.work_position||'Por definir')}</span></div><div class="status" id="status">${statusLabel(c.technician_response)}</div><div class="actions"><button class="yes" onclick="answer('accepted')">✅ SIM, estou disponível</button><button class="no" onclick="answer('declined')">❌ NÃO, não estou disponível</button></div>`}catch(e){host.innerHTML='<h1>Convite indisponível</h1><p class="error">Este link é inválido ou expirou.</p>'}}async function answer(value){const buttons=document.querySelectorAll('button');buttons.forEach(b=>b.disabled=true);try{const r=await fetch(`${SUPA}/concert-response?token=${encodeURIComponent(token)}&answer=${encodeURIComponent(value)}&source=whatsapp&format=json`,{cache:'no-store'});const j=await r.json();if(!r.ok||!j.ok)throw new Error('failed');document.getElementById('content').innerHTML=`<div class="msg">${value==='accepted'?'Disponibilidade confirmada. Obrigado.':'Indisponibilidade registada. Obrigado.'}</div><h1>${value==='accepted'?'✅ Resposta registada':'❌ Resposta registada'}</h1><p>Podes fechar esta página.</p>`}catch(e){buttons.forEach(b=>b.disabled=false);alert('Não foi possível registar a resposta. Tenta novamente.')}}load();</script></body></html>
